<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600&family=Syne:wght@700&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#0b0f14;color:#e8eef4;font-family:Sora,sans-serif;position:relative}
.g1{position:absolute;inset:0;background:radial-gradient(ellipse at 85% 10%,rgba(59,130,246,.28),transparent 55%),radial-gradient(circle at 10% 100%,rgba(122,143,166,.16),transparent 45%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(122,143,166,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(122,143,166,.07) 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(ellipse at 70% 30%,#000 20%,transparent 75%)}
.wrap{position:absolute;inset:0;padding:72px 80px;display:flex;flex-direction:column}
.logo{font-family:Syne;font-weight:700;font-size:34px;letter-spacing:-.02em}
.grad{background:linear-gradient(120deg,#e8eef4 0%,#3b82f6 55%,#7a8fa6 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.pill{margin-top:auto;display:inline-flex;align-items:center;gap:12px;align-self:flex-start;padding:10px 18px;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);font-size:18px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#cbd5e1}
.dot{width:10px;height:10px;border-radius:50%;background:#3b82f6;box-shadow:0 0 16px #3b82f6}
h1{font-family:Syne;font-weight:700;font-size:104px;line-height:1;letter-spacing:-.04em;margin:28px 0 18px}
.title{font-size:40px;font-weight:600;color:#fff;margin:0 0 16px}
.stack{font-size:26px;color:#9aa8b8;margin:0}
.url{position:absolute;right:80px;bottom:72px;font-size:22px;color:#60a5fa;font-weight:600}
</style></head><body><div class="g1"></div><div class="grid"></div>
<div class="wrap">
<div class="logo"><span class="grad">&lt;</span>VW<span class="grad">/&gt;</span></div>
<div class="pill"><span class="dot"></span>Open to full-time & freelance</div>
<h1>Vaibhav <span class="grad">Wable</span></h1>
<p class="title">Mobile &amp; Full-Stack Engineer</p>
<p class="stack">Flutter · React Native · Next.js · Node.js · LLM features</p>
</div><div class="url">wablevaibhav.github.io</div></body></html>
